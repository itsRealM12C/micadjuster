<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Audio Effects & Recording</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.26/Tone.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/RecordRTC/5.6.2/RecordRTC.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .controls, .recording-controls {
            display: none;
            margin-top: 20px;
        }
        .slider-container {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <button id="startBtn">Play Microphone Audio</button>

    <div class="controls" id="controls">
        <div>
            <input type="checkbox" id="hearVoice">
            <label for="hearVoice">Hear Your Voice</label>
        </div>

        <div class="slider-container">
            <label>Pitch Shift: <span id="pitchValue">0</span> semitones</label>
            <input type="range" id="pitchShift" min="-12" max="12" step="1" value="0">
        </div>
        <div class="slider-container">
            <label>Speed: <span id="speedValue">1</span>x</label>
            <input type="range" id="speed" min="0.5" max="2" step="0.01" value="1">
        </div>
        <div class="slider-container">
            <label>Delay: <span id="delayValue">0</span> sec</label>
            <input type="range" id="delay" min="0" max="2" step="0.1" value="0">
        </div>
        <div class="slider-container">
            <label>Loudness: <span id="loudnessValue">1</span>x</label>
            <input type="range" id="loudness" min="0" max="2" step="0.1" value="1">
        </div>
    </div>

    <div class="recording-controls" id="recordingControls">
        <button id="startRecording">Start Recording</button>
        <button id="stopRecording" disabled>Stop Recording</button>
        <div id="downloadLinks"></div>
    </div>

    <script>
        let mic, pitchShift, delayEffect, gainNode, recorder, audioStream;
        let mediaRecorder;
        let recordedChunks = [];

        async function startMicrophone() {
            await Tone.start();
            mic = new Tone.UserMedia();
            await mic.open(); // Request microphone permission

            // Create audio effects
            pitchShift = new Tone.PitchShift(0).toDestination();
            delayEffect = new Tone.FeedbackDelay("0s").toDestination();
            gainNode = new Tone.Gain(1).toDestination(); // Default loudness is 1

            // Connect mic to pitch shift, delay, and gain
            mic.connect(pitchShift);
            pitchShift.connect(delayEffect);
            delayEffect.connect(gainNode);

            // Show controls after microphone is activated
            document.getElementById("controls").style.display = "block";
            document.getElementById("recordingControls").style.display = "block";
        }

        document.getElementById("startBtn").addEventListener("click", startMicrophone);

        // Pitch Shift Control
        document.getElementById("pitchShift").addEventListener("input", function() {
            pitchShift.pitch = parseInt(this.value);
            document.getElementById("pitchValue").innerText = this.value;
        });

        // Speed Control (Not applicable for live mic, works on recorded audio)
        document.getElementById("speed").addEventListener("input", function() {
            document.getElementById("speedValue").innerText = this.value;
        });

        // Delay Control
        document.getElementById("delay").addEventListener("input", function() {
            delayEffect.delayTime.value = this.value;
            document.getElementById("delayValue").innerText = this.value;
        });

        // Loudness Control (Gain control)
        document.getElementById("loudness").addEventListener("input", function() {
            gainNode.gain.value = this.value;
            document.getElementById("loudnessValue").innerText = this.value;
        });

        // Hear Your Own Voice Checkbox
        document.getElementById("hearVoice").addEventListener("change", function() {
            gainNode.gain.value = this.checked ? 1 : 0; // Toggle hearing own voice
        });

        // Recording Setup
        document.getElementById("startRecording").addEventListener("click", startRecording);
        document.getElementById("stopRecording").addEventListener("click", stopRecording);

        async function startRecording() {
            // Record microphone audio using RecordRTC
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(audioStream);
            mediaRecorder.ondataavailable = event => recordedChunks.push(event.data);
            mediaRecorder.onstop = saveRecording;

            mediaRecorder.start();
            document.getElementById("startRecording").disabled = true;
            document.getElementById("stopRecording").disabled = false;
        }

        function stopRecording() {
            mediaRecorder.stop();
            audioStream.getTracks().forEach(track => track.stop()); // Stop mic stream
            document.getElementById("startRecording").disabled = false;
            document.getElementById("stopRecording").disabled = true;
        }

        function saveRecording() {
            const blob = new Blob(recordedChunks, { type: "audio/wav" });
            const audioUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = audioUrl;
            link.download = "recording.wav";
            link.textContent = "Download WAV";
            document.getElementById("downloadLinks").innerHTML = "";
            document.getElementById("downloadLinks").appendChild(link);

            // MP3 and OGG download options can be added by converting the recorded WAV to these formats
        }

    </script>

</body>
</html>
