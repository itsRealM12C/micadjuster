<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Audio Effects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .controls {
            display: none;
            margin-top: 20px;
        }
        .slider-container {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <button id="startBtn">Play Microphone Audio</button>

    <div class="controls" id="controls">
        <div>
            <input type="checkbox" id="hearVoice">
            <label for="hearVoice">Hear Your Voice</label>
        </div>

        <div class="slider-container">
            <label>Pitch Shift: <span id="pitchValue">1</span>x</label>
            <input type="range" id="pitchShift" min="0.5" max="2" step="0.01" value="1">
        </div>
        <div class="slider-container">
            <label>Speed (without pitch change): <span id="speedValue">1</span>x</label>
            <input type="range" id="speed" min="0.5" max="2" step="0.01" value="1">
        </div>
        <div class="slider-container">
            <label>Delay: <span id="delayValue">0</span> sec</label>
            <input type="range" id="delay" min="0" max="2" step="0.1" value="0">
        </div>
    </div>

    <script>
        let audioContext, source, pitchNode, delayNode, gainNode;
        const startBtn = document.getElementById("startBtn");
        const controlsDiv = document.getElementById("controls");
        const hearVoiceCheckbox = document.getElementById("hearVoice");

        async function startMicrophone() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                source = audioContext.createMediaStreamSource(stream);

                // Create nodes
                pitchNode = audioContext.createBiquadFilter();
                pitchNode.type = "allpass"; // Basic pitch shifting (not ideal, but works)

                delayNode = audioContext.createDelay(2.0);
                delayNode.delayTime.value = 0;

                gainNode = audioContext.createGain();
                gainNode.gain.value = 0; // Start muted until checkbox is checked

                // Connect nodes
                source.connect(pitchNode);
                pitchNode.connect(delayNode);
                delayNode.connect(gainNode);
                gainNode.connect(audioContext.destination); // Only plays when checkbox is checked

                // Show controls
                controlsDiv.style.display = "block";
            } catch (error) {
                console.error("Error accessing microphone:", error);
                alert("Microphone access denied!");
            }
        }

        startBtn.addEventListener("click", startMicrophone);

        // Adjust Pitch Shift (basic approximation)
        document.getElementById("pitchShift").addEventListener("input", function() {
            pitchNode.frequency.value = this.value * 1000;
            document.getElementById("pitchValue").innerText = this.value;
        });

        // Adjust Speed (not implemented due to real-time streaming limitations)
        document.getElementById("speed").addEventListener("input", function() {
            document.getElementById("speedValue").innerText = this.value;
        });

        // Adjust Delay
        document.getElementById("delay").addEventListener("input", function() {
            delayNode.delayTime.value = this.value;
            document.getElementById("delayValue").innerText = this.value;
        });

        // Enable/Disable hearing voice
        hearVoiceCheckbox.addEventListener("change", function() {
            gainNode.gain.value = this.checked ? 1 : 0;
        });

    </script>

</body>
</html>
