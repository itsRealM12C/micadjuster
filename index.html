<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Recorder & Effects</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.26/Tone.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .controls {
            display: none;
            margin-top: 20px;
        }
        .slider-container {
            margin: 10px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <button id="startRecording">Start Recording</button>
    <button id="stopRecording" class="hidden">Stop Recording</button>

    <div class="controls" id="controls">
        <button id="playRecording">Play Recording</button>
        
        <div>
            <input type="checkbox" id="hearVoice">
            <label for="hearVoice">Hear Your Voice</label>
        </div>

        <div class="slider-container">
            <label>Pitch Shift: <span id="pitchValue">0</span> semitones</label>
            <input type="range" id="pitchShift" min="-12" max="12" step="1" value="0">
        </div>
        <div class="slider-container">
            <label>Speed: <span id="speedValue">1</span>x</label>
            <input type="range" id="speed" min="0.5" max="2" step="0.01" value="1">
        </div>
        <div class="slider-container">
            <label>Delay: <span id="delayValue">0</span> sec</label>
            <input type="range" id="delay" min="0" max="2" step="0.1" value="0">
        </div>

        <div id="downloadOptions" class="hidden">
            <label>Save As:</label>
            <button class="saveBtn" data-format="mp3">MP3</button>
            <button class="saveBtn" data-format="ogg">OGG</button>
            <button class="saveBtn" data-format="wav">WAV</button>
        </div>
    </div>

    <script>
        let mic, recorder, recordedBuffer, pitchShift, delayEffect, gainNode;
        const startRecBtn = document.getElementById("startRecording");
        const stopRecBtn = document.getElementById("stopRecording");
        const playRecBtn = document.getElementById("playRecording");
        const controlsDiv = document.getElementById("controls");
        const hearVoiceCheckbox = document.getElementById("hearVoice");
        const downloadOptions = document.getElementById("downloadOptions");

        async function startRecording() {
            await Tone.start();
            mic = new Tone.UserMedia();
            recorder = new Tone.Recorder();

            // Create Pitch Shift Effect
            pitchShift = new Tone.PitchShift(0);
            mic.connect(pitchShift);

            // Create Delay Effect
            delayEffect = new Tone.FeedbackDelay("0s");
            pitchShift.connect(delayEffect);

            // Create Gain Node for Hearing Own Voice
            gainNode = new Tone.Gain(0);
            delayEffect.connect(gainNode);
            gainNode.toDestination();

            await mic.open();
            mic.connect(recorder);
            await recorder.start();

            startRecBtn.classList.add("hidden");
            stopRecBtn.classList.remove("hidden");
        }

        async function stopRecording() {
            recordedBuffer = await recorder.stop();
            stopRecBtn.classList.add("hidden");
            controlsDiv.style.display = "block";
            downloadOptions.classList.remove("hidden");
        }

        function playRecording() {
            if (!recordedBuffer) return;
            const player = new Tone.Player(recordedBuffer).toDestination();
            player.playbackRate = parseFloat(document.getElementById("speed").value);
            pitchShift.pitch = parseInt(document.getElementById("pitchShift").value);
            delayEffect.delayTime.value = parseFloat(document.getElementById("delay").value);
            player.start();
        }

        function downloadRecording(format) {
            if (!recordedBuffer) return;
            const blob = new Blob([recordedBuffer], { type: `audio/${format}` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `recording.${format}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        startRecBtn.addEventListener("click", startRecording);
        stopRecBtn.addEventListener("click", stopRecording);
        playRecBtn.addEventListener("click", playRecording);

        document.getElementById("pitchShift").addEventListener("input", function() {
            pitchShift.pitch = parseInt(this.value);
            document.getElementById("pitchValue").innerText = this.value;
        });

        document.getElementById("speed").addEventListener("input", function() {
            document.getElementById("speedValue").innerText = this.value;
        });

        document.getElementById("delay").addEventListener("input", function() {
            delayEffect.delayTime.value = this.value;
            document.getElementById("delayValue").innerText = this.value;
        });

        hearVoiceCheckbox.addEventListener("change", function() {
            gainNode.gain.value = this.checked ? 1 : 0;
        });

        document.querySelectorAll(".saveBtn").forEach(button => {
            button.addEventListener("click", () => downloadRecording(button.dataset.format));
        });

    </script>

</body>
</html>
